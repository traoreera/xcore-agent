name: Build binaries & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à republier (ex: v0.1.0)"
        required: true
        type: string
      force:
        description: "Confirmer la republication de la même version"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le consentement
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.force }}" != "true" ]; then
            echo "❌ Cochez 'force' pour confirmer la republication."
            exit 1
          fi
          echo "✅ Republication confirmée pour ${{ inputs.tag }}"

  resolve-ref:
    name: Resolve ref
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(echo '${{ inputs.tag }}' | tr '[:upper:]' '[:lower:]')
            echo "ref=refs/tags/$TAG" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # Binaires PyInstaller — un par OS (le runner cible = la plateforme
  # produite ; PyInstaller ne cross-compile pas)
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}
    needs: resolve-ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            bin_name: xcore-agent
            archive_ext: tar.gz
          - os: macos-latest # Apple Silicon — voir note macos-13 dans xscanner
            asset_os: macos
            bin_name: xcore-agent
            archive_ext: tar.gz
          - os: windows-latest
            asset_os: windows
            bin_name: xcore-agent.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build binary
        run: >
          pyinstaller --onefile --name xcore-agent --console
          -p . packaging/entry.py

      - name: Smoke test
        shell: bash
        run: dist/${{ matrix.bin_name }} --help

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd dist
          tar czf xcore-agent-${{ needs.resolve-ref.outputs.version }}-${{ matrix.asset_os }}.tar.gz ${{ matrix.bin_name }}

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/${{ matrix.bin_name }} -DestinationPath dist/xcore-agent-${{ needs.resolve-ref.outputs.version }}-${{ matrix.asset_os }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset_os }}
          path: |
            dist/xcore-agent-*.tar.gz
            dist/xcore-agent-*.zip
            dist/${{ matrix.bin_name }}

  # ──────────────────────────────────────────────────────────────
  # .deb / .rpm depuis le binaire Linux (fpm)
  # ──────────────────────────────────────────────────────────────
  package-linux:
    name: .deb / .rpm
    needs: [resolve-ref, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: dist

      - name: Install fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm
        run: |
          chmod +x dist/xcore-agent
          VERSION="${{ needs.resolve-ref.outputs.version }}"
          fpm -s dir -t deb -n xcore-agent -v "$VERSION" \
            --description "Deployment agent for XCore .xdeploy artifacts" \
            --license MIT --url "https://github.com/traoreera/xcore-agent" \
            --package dist/xcore-agent_${VERSION}_amd64.deb \
            dist/xcore-agent=/usr/bin/xcore-agent
          fpm -s dir -t rpm -n xcore-agent -v "$VERSION" \
            --description "Deployment agent for XCore .xdeploy artifacts" \
            --license MIT --url "https://github.com/traoreera/xcore-agent" \
            --package dist/xcore-agent-${VERSION}-1.x86_64.rpm \
            dist/xcore-agent=/usr/bin/xcore-agent

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  # ──────────────────────────────────────────────────────────────
  # GitHub Release avec tous les binaires/archives/paquets attachés
  # ──────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [resolve-ref, build, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-ref.outputs.version }}
          name: "xcore-agent v${{ needs.resolve-ref.outputs.version }}"
          draft: false
          files: |
            dist/xcore-agent-*.tar.gz
            dist/xcore-agent-*.zip
            dist/*.deb
            dist/*.rpm

      - name: Checksums (pour taps/buckets)
        run: |
          cd dist
          sha256sum xcore-agent-*.tar.gz xcore-agent-*.zip *.deb *.rpm > checksums.txt 2>/dev/null || true
          cat checksums.txt
